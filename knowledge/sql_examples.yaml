# Verified question -> SQL pairs used as few-shot examples (RAG "sql" collection).
# Every example is checked by the SQL validator when loaded, and the integration
# test suite executes all of them against the sample database.
# Add your own pairs here, or click "Save as example" in the UI after a good answer.

- question: What were our total sales last month?
  sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS total_revenue
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
      AND o.order_date >= date_trunc('month', CURRENT_DATE) - INTERVAL '1 month'
      AND o.order_date < date_trunc('month', CURRENT_DATE);

- question: Show the top 10 customers by revenue.
  sql: |
    SELECT c.customer_id,
           c.first_name || ' ' || c.last_name AS customer_name,
           c.segment,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM customers c
    JOIN orders o ON o.customer_id = c.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY c.customer_id, customer_name, c.segment
    ORDER BY revenue DESC
    LIMIT 10;

- question: Which products have the highest sales?
  sql: |
    SELECT p.name AS product_name,
           cat.name AS category,
           SUM(oi.quantity) AS units_sold,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories cat ON cat.category_id = p.category_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY p.product_id, p.name, cat.name
    ORDER BY revenue DESC
    LIMIT 10;

- question: Compare monthly revenue for the last year.
  sql: |
    SELECT date_trunc('month', o.order_date)::date AS month,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
      AND o.order_date >= date_trunc('month', CURRENT_DATE) - INTERVAL '12 months'
      AND o.order_date < date_trunc('month', CURRENT_DATE)
    GROUP BY 1
    ORDER BY 1;

- question: Find customers who haven't placed an order in the last 90 days.
  sql: |
    SELECT c.customer_id,
           c.first_name || ' ' || c.last_name AS customer_name,
           c.email,
           MAX(o.order_date)::date AS last_order_date
    FROM customers c
    LEFT JOIN orders o ON o.customer_id = c.customer_id
    WHERE NOT EXISTS (
        SELECT 1 FROM orders o2
        WHERE o2.customer_id = c.customer_id
          AND o2.order_date >= CURRENT_DATE - INTERVAL '90 days'
    )
    GROUP BY c.customer_id, customer_name, c.email
    ORDER BY last_order_date DESC NULLS LAST;

- question: Show total revenue by month.
  sql: |
    SELECT date_trunc('month', o.order_date)::date AS month,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY 1
    ORDER BY 1;

- question: Compare monthly revenue in 2025 with 2024.
  sql: |
    SELECT EXTRACT(MONTH FROM o.order_date)::int AS month_num,
           ROUND(SUM(CASE WHEN EXTRACT(YEAR FROM o.order_date) = 2024
                          THEN oi.quantity * oi.unit_price * (1 - oi.discount) END), 2) AS revenue_2024,
           ROUND(SUM(CASE WHEN EXTRACT(YEAR FROM o.order_date) = 2025
                          THEN oi.quantity * oi.unit_price * (1 - oi.discount) END), 2) AS revenue_2025
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
      AND o.order_date >= DATE '2024-01-01'
      AND o.order_date < DATE '2026-01-01'
    GROUP BY 1
    ORDER BY 1;

- question: What is the revenue by product category?
  sql: |
    SELECT cat.name AS category,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories cat ON cat.category_id = p.category_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY cat.name
    ORDER BY revenue DESC;

- question: What share of orders comes from each sales channel?
  sql: |
    SELECT o.sales_channel,
           COUNT(*) AS orders,
           ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct_of_orders
    FROM orders o
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY o.sales_channel
    ORDER BY orders DESC;

- question: What is the average order value this year?
  sql: |
    SELECT ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) / COUNT(DISTINCT o.order_id), 2) AS average_order_value
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
      AND o.order_date >= date_trunc('year', CURRENT_DATE);

- question: How many new customers signed up each month this year?
  sql: |
    SELECT date_trunc('month', c.signup_date)::date AS month,
           COUNT(*) AS new_customers
    FROM customers c
    WHERE c.signup_date >= date_trunc('year', CURRENT_DATE)
    GROUP BY 1
    ORDER BY 1;

- question: What is the gross margin by category?
  sql: |
    SELECT cat.name AS category,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue,
           ROUND(SUM(oi.quantity * (oi.unit_price * (1 - oi.discount) - p.unit_cost)), 2) AS gross_profit,
           ROUND(100 * SUM(oi.quantity * (oi.unit_price * (1 - oi.discount) - p.unit_cost))
                 / NULLIF(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 0), 1) AS gross_margin_pct
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories cat ON cat.category_id = p.category_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY cat.name
    ORDER BY gross_margin_pct DESC;

- question: What is the return rate by category?
  sql: |
    SELECT cat.name AS category,
           ROUND(100.0 * COUNT(DISTINCT o.order_id) FILTER (WHERE o.status = 'returned')
                 / NULLIF(COUNT(DISTINCT o.order_id) FILTER (WHERE o.status IN ('delivered', 'returned')), 0), 2) AS return_rate_pct
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories cat ON cat.category_id = p.category_id
    GROUP BY cat.name
    ORDER BY return_rate_pct DESC;

- question: Revenue by customer segment and sales channel
  sql: |
    SELECT c.segment,
           o.sales_channel,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY c.segment, o.sales_channel
    ORDER BY c.segment, revenue DESC;

- question: How many orders were placed in each status?
  sql: |
    SELECT o.status, COUNT(*) AS orders
    FROM orders o
    GROUP BY o.status
    ORDER BY orders DESC;

- question: Which states generate the most revenue?
  sql: |
    SELECT c.state,
           COUNT(DISTINCT c.customer_id) AS customers,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS revenue
    FROM customers c
    JOIN orders o ON o.customer_id = c.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status NOT IN ('cancelled', 'returned')
    GROUP BY c.state
    ORDER BY revenue DESC
    LIMIT 10;
