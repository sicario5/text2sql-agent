[project]
name = "text2sql-agent"
version = "1.0.0"
description = "AI-powered Text-to-SQL RAG agent for PostgreSQL (Vanna + Streamlit)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the sample PostgreSQL database (set TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "fakes", "fake_llm_server"]
