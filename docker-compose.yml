services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopdb}
      POSTGRES_USER: ${POSTGRES_USER:-shop_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      READONLY_USER: ${READONLY_USER:-text2sql_reader}
      READONLY_PASSWORD: ${READONLY_PASSWORD:?set READONLY_PASSWORD in .env}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-15}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # inside the compose network the database host is the service name
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-shopdb}
      DB_READONLY_USER: ${READONLY_USER:-text2sql_reader}
      DB_READONLY_PASSWORD: ${READONLY_PASSWORD}
      VECTOR_DB_PATH: /app/data/chroma
    volumes:
      - chroma:/app/data
      - ./knowledge:/app/knowledge:ro
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama/LLM proxies running on the host
    depends_on:
      postgres:
        condition: service_healthy

  # Optional local LLM:  docker compose --profile ollama up -d
  # then: docker compose exec ollama ollama pull qwen2.5-coder:7b
  # and set LLM_PROVIDER=ollama, LLM_MODEL=qwen2.5-coder:7b, LLM_BASE_URL=http://ollama:11434/v1
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  chroma:
  ollama:
